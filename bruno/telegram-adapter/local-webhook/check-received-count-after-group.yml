info:
  name: Check Received Count After Group
  type: http
  seq: 5

http:
  method: GET
  url: "{{local_received_count_url}}"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("the group message brought the total to two dispatched messages", function () {
          expect(res.status).to.equal(200);
          expect(res.body.count).to.equal(2);
        });

docs: |-
  Only meaningful against `tests/bruno/webhook-test-server.ts` (see Check
  Received Count After Direct for details). One dispatch from the direct-chat
  pair plus one from the group message = 2.
