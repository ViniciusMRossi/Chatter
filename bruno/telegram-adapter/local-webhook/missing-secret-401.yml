info:
  name: Missing Secret (expect 401)
  type: http
  seq: 11

http:
  method: POST
  url: "{{local_webhook_url}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "update_id": 100003,
        "message": {
          "message_id": 3,
          "date": 1700000000,
          "chat": { "id": 555, "type": "private", "first_name": "Ada" },
          "from": { "id": 777, "is_bot": false, "first_name": "Ada" },
          "text": "should be rejected"
        }
      }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 401", function () {
          expect(res.status).to.equal(401);
        });

docs: |-
  No X-Telegram-Bot-Api-Secret-Token header at all. Expect HTTP 401 and no
  reply — proves the webhook handler rejects unauthenticated requests before
  parsing or dispatching anything (createTelegramWebhookHandler checks the
  secret first; see specs/002-telegram-adapter/spec.md Story 3).
