info:
  name: Check Received Count After Mentions
  type: http
  seq: 15

http:
  method: GET
  url: "{{local_received_count_url}}"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("both mention messages were dispatched, bringing the total to eight", function () {
          expect(res.status).to.equal(200);
          expect(res.body.count).to.equal(8);
        });

docs: |-
  Only meaningful against `tests/bruno/webhook-test-server.ts` (see Check
  Received Count After Direct for details). Six after the media group, plus the
  mention message and the bot-command message = 8.

  Note the bot-command message still counts here: FR-017 says it produces no
  *mention*, not that it is dropped. A message is always delivered regardless of
  what its entities do or don't map to.
