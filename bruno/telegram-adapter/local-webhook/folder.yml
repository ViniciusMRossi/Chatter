info:
  name: Local Webhook (inbound)
  type: folder
  seq: 2

docs: |-
  Synthetic Telegram webhook deliveries targeting your own locally running
  webhook handler (e.g. `pnpm start` in example-apps/telegram-echo). These never
  contact Telegram — no real bot, token, or tunnel required, just a server
  listening at `local_webhook_url`. Payload shapes match the synthetic Updates
  used in packages/telegram/tests/integration/*.spec.ts.

  This folder runs automatically in CI (`pnpm run test:bruno` in
  packages/telegram) against `tests/bruno/webhook-test-server.ts`, a stub-backed
  server started just for the run — zero real Telegram credentials, per this
  project's standing rule. Requests are sequenced (seq 1-8) so the dedup and
  security assertions build on each other; don't reorder them. The three
  "Check Received Count" requests query that test server's introspection
  endpoint and will fail (harmlessly) if pointed at the real example app instead.
