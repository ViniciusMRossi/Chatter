info:
  name: Wrong Secret (expect 401)
  type: http
  seq: 12

http:
  method: POST
  url: "{{local_webhook_url}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Telegram-Bot-Api-Secret-Token
      value: this-is-not-the-configured-secret
  body:
    type: json
    data: |-
      {
        "update_id": 100004,
        "message": {
          "message_id": 4,
          "date": 1700000000,
          "chat": { "id": 555, "type": "private", "first_name": "Ada" },
          "from": { "id": 777, "is_bot": false, "first_name": "Ada" },
          "text": "should also be rejected"
        }
      }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 401", function () {
          expect(res.status).to.equal(401);
        });

docs: |-
  A secret header is present but doesn't match the adapter's configured
  webhook_secret. Expect the same HTTP 401, no reply — the comparison is
  timing-safe (crypto.timingSafeEqual), not a plain string equality check.
