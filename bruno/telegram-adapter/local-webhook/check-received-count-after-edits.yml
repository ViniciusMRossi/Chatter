info:
  name: Check Received Count After Edits
  type: http
  seq: 18

http:
  method: GET
  url: "{{local_received_count_url}}"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("the edit dispatched exactly once", function () {
          expect(res.status).to.equal(200);
          expect(res.body.count).to.equal(9);
        });

docs: |-
  Eight from the requests before the edit section, plus one for the edit itself.

  An edit IS a dispatch — it reaches the application, so it counts. What it must
  not do is arrive twice, or arrive as a second created message.
