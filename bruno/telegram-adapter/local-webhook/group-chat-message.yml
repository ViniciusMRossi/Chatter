info:
  name: Group Chat Message
  type: http
  seq: 4

http:
  method: POST
  url: "{{local_webhook_url}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Telegram-Bot-Api-Secret-Token
      value: "{{webhook_secret}}"
  body:
    type: json
    data: |-
      {
        "update_id": 100002,
        "message": {
          "message_id": 2,
          "date": 1700000000,
          "chat": { "id": -1001234567890, "type": "supergroup", "title": "Team Chat" },
          "from": { "id": 888, "is_bot": false, "first_name": "Grace" },
          "text": "hello team from Bruno"
        }
      }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.status).to.equal(200);
        });

docs: |-
  Simulates Telegram delivering a group (supergroup) text message — the same
  webhook handler and application code as Direct Chat Message, just a different
  chat shape. Conversation type should map to "group" (chat.type "supergroup" or
  "group" both map to "group"). This is the pairing that proves the Phase 2
  roadmap exit criterion: identical application code, both conversation types.
