info:
  name: Check Last Message Is An Edit
  type: http
  seq: 17

http:
  method: GET
  url: "{{local_last_event_url}}"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("the edit was dispatched as message.edited, not as a created message", function () {
          expect(res.status).to.equal(200);
          expect(res.body.kind).to.equal("message.edited");
        });

        test("it carries the message id it was delivered under", function () {
          expect(res.body.message.id).to.equal("900");
        });

        test("editedAt is present and createdAt is the original send time", function () {
          expect(res.body.message.editedAt).to.be.a("string");
          expect(new Date(res.body.message.createdAt).getTime()).to.equal(1700000000000);
          expect(new Date(res.body.message.editedAt).getTime()).to.equal(1700000300000);
        });

        test("mentions reflect the edited content", function () {
          expect(res.body.message.mentions.length).to.equal(1);
          expect(res.body.message.mentions[0].text).to.equal("@alice");
          var text = res.body.message.text;
          var m = res.body.message.mentions[0];
          expect(text.slice(m.offset, m.offset + m.length)).to.equal(m.text);
        });

docs: |-
  This is where Edited Message is actually verified, and it needs `/last-event`
  rather than `/last-message`: a correctly dispatched edit and one wrongly routed
  through the created-message path both answer 200 and both leave the same message
  behind. Only the event KIND distinguishes them, and that distinction is the whole
  of FR-002 — every application written before edits existed acts on whatever
  arrives as `message.created`, so an edit delivered there makes all of them
  double-handle.

  `createdAt` must still be the ORIGINAL send time. An edit reports a change of
  content, never a change of when the message was sent.

  Only meaningful against `tests/bruno/webhook-test-server.ts`, the only server
  exposing `/last-event`.
