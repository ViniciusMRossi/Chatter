info:
  name: Get Webhook Info
  type: http
  seq: 2

http:
  method: GET
  url: "{{telegram_api_base}}/bot{{bot_token}}/getWebhookInfo"
  auth: none

docs: |-
  Returns the currently registered webhook URL and any delivery errors Telegram
  has recorded (`url`, `last_error_message`, `pending_update_count`, ...). Not
  called by the adapter itself — useful for MANUAL-VERIFICATION.md steps 1 and 5:
  confirm `url` matches what you configured after start(), and confirm it's empty
  again after stop().
