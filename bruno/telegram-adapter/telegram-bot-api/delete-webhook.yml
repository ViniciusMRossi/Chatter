http:
  method: POST
  url: "{{telegram_api_base}}/bot{{bot_token}}/deleteWebhook"
  auth: none

docs: |-
  Removes the registered webhook — what TelegramAccountAdapter.stop() does
  automatically. A failure here is what T014-T016's onNonFatalError hardening
  (packages/telegram/src/adapter/telegram-account-adapter.ts) surfaces rather
  than silently discarding.
