info:
  name: Send Video
  type: http
  seq: 7

http:
  method: POST
  url: "{{telegram_api_base}}/bot{{bot_token}}/sendVideo"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "chat_id": "{{chat_id}}",
        "video": "https://www.w3schools.com/html/mov_bbb.mp4",
        "caption": "Sent from Bruno"
      }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("video sent", function () {
          expect(res.status).to.equal(200);
          expect(res.body.ok).to.equal(true);
          expect(res.body.result.video).to.be.an("object");
        });

docs: |-
  Sends a video by URL — what TelegramAccountAdapter.send() does internally
  for a `{ url }`-sourced video attachment. See Send Photo's docs for the
  same notes on the raw-bytes upload path not being representable here.
