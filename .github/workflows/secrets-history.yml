name: Scheduled Secret History Scan

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  gitleaks-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks repository history
        run: |
          set -euo pipefail
          source .sdd/tool-versions.env
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            "$GITLEAKS_IMAGE" \
            git --redact --verbose /repo
